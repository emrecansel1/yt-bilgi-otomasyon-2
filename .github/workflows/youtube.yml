name: YouTube Otomatik Video

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  video-yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Europe/Istanbul

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libespeak-ng1
          echo "Piper gerçek TTS binary kuruluyor..."
          wget -q https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz -O piper.tar.gz
          tar -xzf piper.tar.gz
          sudo cp piper/piper /usr/local/bin/piper
          sudo chmod +x /usr/local/bin/piper
          rm -rf piper piper.tar.gz
          piper --help

      - name: Python paketlerini kur
        run: |
          pip install requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: YouTube token oluştur
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Config oluştur
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json

      - name: Video oluştur ve yükle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_video.py
